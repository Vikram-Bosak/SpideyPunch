app:
  timezone: "America/New_York"
  downloads_dir: "downloads"
  max_retries_per_platform: 3

drive:
  # Google Drive folder structure (root is the shared folder):
  #   spideypuch-videos-upload / Ready
  #   spideypuch-videos-upload / Processing
  #   spideypuch-videos-upload / Uploaded
  # Folder paths are resolved by name; optionally override with explicit folder IDs.
  root_folder_id: "122o16C_lF8HA6tJjib9Ez8BxgC3VH5Lg"
  folder_paths:
    ready: "Ready"
    processing: "Processing"
    uploaded: "Uploaded"

youtube:
  # Privacy status for uploads: public / private / unlisted
  privacy_status: "public"
  category_id: "24"             # Entertainment
  # Shorts are uploaded as normal videos but with #Shorts in title and
  # vertical aspect ratio. Keep true to match the workflow requirement.
  shorts: true
  publish_enabled: true

facebook:
  api_version: "v21.0"
  privacy: "PUBLIC"

discord:
  webhook_url_env: "DISCORD_WEBHOOK_URL"
  report_title: "Hollywood Movie Clips - Upload Report"

seo:
  # All SEO / metadata is generated in American English (US audience).
  locale: "en-US"
  # Optional LLM enrichment via OpenAI-compatible API.
  llm:
    api_key_env: "USER_LLM_API_KEY"
    base_url_env: "USER_LLM_BASE_URL"
    model_env: "USER_LLM_MODEL"
    model_default: "deepseek-chat"
